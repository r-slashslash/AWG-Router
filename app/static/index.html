<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AWG Router</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='7' cy='16' r='5' fill='%232f6feb'/%3E%3Cpath d='M12 16h8' stroke='%232f6feb' stroke-width='4'/%3E%3Ccircle cx='25' cy='16' r='5' fill='none' stroke='%230e9f6e' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="static/app.css">
<script src="static/i18n.js"></script>
<script src="static/qrcode.js" defer></script>
</head>
<body>
<div id="login" class="login" hidden>
  <form id="login-form" class="login-box">
    <div class="login-top">
      <div class="brand brand-lg"><span class="brand-mark" aria-hidden="true"></span>AWG Router</div>
      <select id="lang-login"></select>
    </div>
    <label class="field"><span data-i18n="login.password"></span>
      <input type="password" id="login-pass" autocomplete="current-password" required autofocus>
    </label>
    <label class="field" id="login-code-wrap" hidden><span data-i18n="login.code"></span>
      <input type="text" id="login-code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" dir="ltr">
      <span class="hint" data-i18n="login.code_hint"></span>
    </label>
    <p class="err" id="login-err" hidden></p>
    <button class="btn primary wide" type="submit" data-i18n="login.submit"></button>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>AWG Router</div>
    <div class="top-end">
      <div id="status" class="status"></div>
      <select id="lang-top"></select>
    </div>
  </header>
  <nav class="tabs" id="tabs" role="tablist">
    <button data-tab="overview" role="tab" data-i18n="tab.overview"></button>
    <button data-tab="clients" role="tab" data-i18n="tab.clients"></button>
    <button data-tab="exits" role="tab" data-i18n="tab.exits"></button>
    <button data-tab="routing" role="tab" data-i18n="tab.routing"></button>
    <button data-tab="lists" role="tab" data-i18n="tab.lists"></button>
    <button data-tab="server" role="tab" data-i18n="tab.server"></button>
    <button data-tab="system" role="tab" data-i18n="tab.system"></button>
  </nav>
  <main id="main"></main>
</div>

<dialog id="modal"><div id="modal-body"></div></dialog>
<div id="toasts" aria-live="polite"></div>
<script src="static/app.js"></script>
</body>
</html>
