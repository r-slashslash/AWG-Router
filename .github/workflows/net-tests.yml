# Сетевые сквозные тесты на машине GitHub (root, сетевые пространства, настоящие программы):
#   tests/netns_e2e.py         — маршрутизация панели: клиент уходит в выход или напрямую по правилам;
#   tests/awg_real_e2e.py      — настоящий туннель AmneziaWG: .conf и vpn:// подключаются, отключённый
#                                клиент — нет;
#   tests/domains_socks_e2e.py — выход SOCKS5 (hev-socks5-tunnel) и правила по доменам (sniproxy);
#   tests/shaping_e2e.py       — ограничение скорости (tc: клиенты, все вместе, выходы) и балансировка
#                                (открытое соединение остаётся на прежнем выходе).
# Задание kernel: модуль ядра AmneziaWG ставится той же командой, что у пользователей
# (install.sh --install-kernel), и настоящий туннель идёт на нём и вперемешку с amneziawg-go.
# awg, amneziawg-go и hev-socks5-tunnel собираются из стадий текущего Dockerfile — те же версии и флаги,
# что попадут в образ следующего релиза. pyroute2 и nftables ставятся только на машину CI (в панель
# не попадают: там по-прежнему только стандартная библиотека).
# Идут на каждом пуше в main перед черновиком релиза (release.yml, задание net) и вручную.
name: Network tests

on:
  workflow_call:        # из release.yml: перед образами и черновиком релиза
  workflow_dispatch:    # вручную: Actions → Network tests → Run workflow

permissions:
  contents: read

jobs:
  net:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.13"

      - name: Tools (nftables, pyroute2)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables >/dev/null
          python -m pip install -q --target "$RUNNER_TEMP/py" pyroute2
          nft --version
          PYTHONPATH="$RUNNER_TEMP/py" python -c "import pyroute2; print('pyroute2', pyroute2.__version__)"
          uname -r
          # модули для ограничения скорости; у облачных ядер ifb бывает только в linux-modules-extra
          sudo modprobe -a ifb sch_htb sch_fq_codel act_mirred cls_u32 cls_matchall 2>/dev/null || {
            sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" >/dev/null
            sudo modprobe -a ifb sch_htb sch_fq_codel act_mirred cls_u32 cls_matchall
          }
          tc -V

      - name: AmneziaWG and hev-socks5-tunnel from the Dockerfile stages
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          for stage in awg-go awg-tools hev; do
            docker build -q --target "$stage" -t "e2e-$stage" . >/dev/null
            id=$(docker create "e2e-$stage")
            docker cp "$id:/out/." "$RUNNER_TEMP/bin/"
            docker rm "$id" >/dev/null
          done
          ls -l "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/awg" --version

      - name: Routing (netns_e2e.py)
        if: always()
        run: sudo env PATH="$RUNNER_TEMP/bin:$PATH" PYTHONPATH="$RUNNER_TEMP/py:." "$(which python)" tests/netns_e2e.py

      - name: Real AmneziaWG tunnel (awg_real_e2e.py)
        if: always()
        run: sudo env PATH="$RUNNER_TEMP/bin:$PATH" PYTHONPATH="$RUNNER_TEMP/py:." "$(which python)" tests/awg_real_e2e.py

      - name: SOCKS5 exit and domain rules (domains_socks_e2e.py)
        if: always()
        run: sudo env PATH="$RUNNER_TEMP/bin:$PATH" PYTHONPATH="$RUNNER_TEMP/py:." "$(which python)" tests/domains_socks_e2e.py

      - name: Speed limits and load balancing (shaping_e2e.py)
        if: always()
        run: sudo env PATH="$RUNNER_TEMP/bin:$PATH" PYTHONPATH="$RUNNER_TEMP/py:." "$(which python)" tests/shaping_e2e.py

      - name: Moving the AWG server to the host (movehost_e2e.py)
        # последним: ставит awg-quick@awg0 на саму машину (одноразовую)
        if: always()
        run: sudo env PATH="$RUNNER_TEMP/bin:$PATH" PYTHONPATH="$RUNNER_TEMP/py:." "$(which python)" tests/movehost_e2e.py

  kernel:
    # Не держит выпуск: сборка DKMS зависит от PPA Amnezia и ядра машины GitHub. Падение видно в прогоне
    # (и в нём же — почему), а черновик всё равно создаётся: по умолчанию панель на amneziawg-go.
    # Две машины: на 24.04 ядро 7.x (модуль PPA может не собраться — проверяется честный отказ команды),
    # на 22.04 — ядро постарше, на нём проверяется сам туннель на модуле.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.13"

      - name: Tools (pyroute2, awg, amneziawg-go)
        run: |
          python -m pip install -q --target "$RUNNER_TEMP/py" pyroute2
          mkdir -p "$RUNNER_TEMP/bin"
          for stage in awg-go awg-tools; do
            docker build -q --target "$stage" -t "e2e-$stage" . >/dev/null
            id=$(docker create "e2e-$stage")
            docker cp "$id:/out/." "$RUNNER_TEMP/bin/"
            docker rm "$id" >/dev/null
          done
          uname -r

      - name: Kernel module (install.sh --install-kernel)
        id: module
        run: sudo env AWGR_YES=y bash install.sh --install-kernel

      - name: Real tunnel on the kernel module
        run: sudo env AWGT_ENGINE=kernel PATH="$RUNNER_TEMP/bin:$PATH" PYTHONPATH="$RUNNER_TEMP/py:." "$(which python)" tests/awg_real_e2e.py

      - name: Kernel server, amneziawg-go client
        if: always() && steps.module.outcome == 'success'
        run: sudo env AWGT_ENGINE=mixed PATH="$RUNNER_TEMP/bin:$PATH" PYTHONPATH="$RUNNER_TEMP/py:." "$(which python)" tests/awg_real_e2e.py

      - name: DKMS build log
        if: failure()
        run: sudo sh -c 'cat /var/lib/dkms/amneziawg/*/build/make.log 2>/dev/null | tail -80' || true
