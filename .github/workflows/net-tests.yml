# Сетевые сквозные тесты на машине GitHub (root, сетевые пространства, настоящие программы):
#   tests/netns_e2e.py         — маршрутизация панели: клиент уходит в выход или напрямую по правилам;
#   tests/awg_real_e2e.py      — настоящий туннель AmneziaWG: .conf и vpn:// подключаются, отключённый
#                                клиент — нет;
#   tests/domains_socks_e2e.py — выход SOCKS5 (hev-socks5-tunnel) и правила по доменам (sniproxy).
# awg, amneziawg-go и hev-socks5-tunnel собираются из стадий текущего Dockerfile — те же версии и флаги,
# что попадут в образ следующего релиза. pyroute2 и nftables ставятся только на машину CI (в панель
# не попадают: там по-прежнему только стандартная библиотека).
name: Network tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  net:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Tools (nftables, pyroute2)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables >/dev/null
          python -m pip install -q --target "$RUNNER_TEMP/py" pyroute2
          nft --version
          PYTHONPATH="$RUNNER_TEMP/py" python -c "import pyroute2; print('pyroute2', pyroute2.__version__)"
          uname -r
          sysctl net.core.devconf_inherit_init_net net.ipv4.conf.all.rp_filter net.ipv4.conf.default.rp_filter || true

      - name: AmneziaWG and hev-socks5-tunnel from the Dockerfile stages
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          for stage in awg-go awg-tools hev; do
            docker build -q --target "$stage" -t "e2e-$stage" . >/dev/null
            id=$(docker create "e2e-$stage")
            docker cp "$id:/out/." "$RUNNER_TEMP/bin/"
            docker rm "$id" >/dev/null
          done
          ls -l "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/awg" --version

      - name: Routing (netns_e2e.py)
        if: always()
        run: sudo env PATH="$RUNNER_TEMP/bin:$PATH" PYTHONPATH="$RUNNER_TEMP/py:." "$(which python)" tests/netns_e2e.py

      - name: Real AmneziaWG tunnel (awg_real_e2e.py)
        if: always()
        run: sudo env PATH="$RUNNER_TEMP/bin:$PATH" PYTHONPATH="$RUNNER_TEMP/py:." "$(which python)" tests/awg_real_e2e.py

      - name: SOCKS5 exit and domain rules (domains_socks_e2e.py)
        if: always()
        run: sudo env PATH="$RUNNER_TEMP/bin:$PATH" PYTHONPATH="$RUNNER_TEMP/py:." "$(which python)" tests/domains_socks_e2e.py
