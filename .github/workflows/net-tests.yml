# Сетевые сквозные тесты на машине GitHub (root, сетевые пространства, настоящие программы):
#   tests/netns_e2e.py         — маршрутизация панели: клиент уходит в выход или напрямую по правилам;
#   tests/awg_real_e2e.py      — настоящий туннель AmneziaWG: .conf и vpn:// подключаются, отключённый
#                                клиент — нет;
#   tests/domains_socks_e2e.py — выход SOCKS5 (hev-socks5-tunnel) и правила по доменам (sniproxy);
#   tests/shaping_e2e.py       — ограничение скорости (tc: клиенты, все вместе, выходы) и балансировка
#                                (открытое соединение остаётся на прежнем выходе);
#   tests/container_e2e.py     — свой контейнер сервера AWG ставит правила панели до подъёма сервера, события Docker;
#   tests/movehost_e2e.py      — перенос сервера на хост; служба awg-quick ставит правила «до панели».
# Задание kernel: модуль ядра AmneziaWG ставится той же командой, что у пользователей
# (install.sh --install-kernel), и настоящий туннель идёт на нём и вперемешку с amneziawg-go.
# awg, amneziawg-go и hev-socks5-tunnel собираются из стадий текущего Dockerfile — те же версии и флаги,
# что попадут в образ следующего релиза. pyroute2 и nftables ставятся только на машину CI (в панель
# не попадают: там по-прежнему только стандартная библиотека).
# Задание lint: проверка кода — Python (ruff, ruff.toml) и скрипты интерфейса (eslint, eslint.config.mjs):
# неизвестные имена и явные ошибки. Ставятся только на машину CI. И юнит-тесты на версии Python образа панели: ветку
# до «да» проверяет этот workflow, а в песочнице сессии своя версия Python (смена 3.13 → 3.15, PR #45).
# Идут на каждом пуше в main перед черновиком релиза (release.yml, задание net) и вручную.
name: Network tests

on:
  workflow_call:        # из release.yml: перед образами и черновиком релиза
  workflow_dispatch:    # вручную: Actions → Network tests → Run workflow

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.15"

      - name: Python (ruff)
        run: |
          python -m pip install -q ruff==0.16.9
          ruff check . --output-format github

      - name: Interface scripts (eslint)
        run: |
          node --version
          npx --yes eslint@10.1.0 app/static

      - name: Unit tests (the image's Python)
        run: python -W always::ResourceWarning -m unittest discover tests

  net:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.15"

      - name: Tools (nftables, pyroute2)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables strace >/dev/null   # strace — разбор, если hev не запустится
          python -m pip install -q --target "$RUNNER_TEMP/py" pyroute2==0.9.7
          nft --version
          PYTHONPATH="$RUNNER_TEMP/py" python -c "import pyroute2; print('pyroute2', pyroute2.__version__)"
          uname -r
          # модули для ограничения скорости; у облачных ядер ifb бывает только в linux-modules-extra
          sudo modprobe -a ifb sch_htb sch_fq_codel act_mirred cls_u32 cls_matchall 2>/dev/null || {
            sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" >/dev/null
            sudo modprobe -a ifb sch_htb sch_fq_codel act_mirred cls_u32 cls_matchall
          }
          tc -V

      - name: AmneziaWG and hev-socks5-tunnel from the Dockerfile stages
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          for stage in awg-go awg-tools hev; do
            docker build -q --target "$stage" -t "e2e-$stage" . >/dev/null
            id=$(docker create "e2e-$stage")
            docker cp "$id:/out/." "$RUNNER_TEMP/bin/"
            docker rm "$id" >/dev/null
          done
          ls -l "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/awg" --version

      - name: Routing (netns_e2e.py)
        if: always()
        run: sudo env PATH="$RUNNER_TEMP/bin:$PATH" PYTHONPATH="$RUNNER_TEMP/py:." "$(which python)" tests/netns_e2e.py

      - name: Real AmneziaWG tunnel (awg_real_e2e.py)
        if: always()
        run: sudo env PATH="$RUNNER_TEMP/bin:$PATH" PYTHONPATH="$RUNNER_TEMP/py:." "$(which python)" tests/awg_real_e2e.py

      - name: SOCKS5 exit and domain rules (domains_socks_e2e.py)
        if: always()
        run: sudo env PATH="$RUNNER_TEMP/bin:$PATH" PYTHONPATH="$RUNNER_TEMP/py:." "$(which python)" tests/domains_socks_e2e.py

      - name: Exit check against the real internet (probe.py)
        # настоящие 1.1.1.1 и 8.8.8.8: задержка до первого байта ответа, IP, UDP (QUIC). Интернет машины
        # GitHub — не наш код, поэтому выпуск не держит
        if: always()
        continue-on-error: true
        run: |
          out=$(python3 app/probe.py 0 --udp)
          echo "$out"
          echo "$out" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] and d["ip"] and d["latency_ms"] > 0 and d["udp"] is True, d'

      - name: Speed limits and load balancing (shaping_e2e.py)
        if: always()
        run: sudo env PATH="$RUNNER_TEMP/bin:$PATH" PYTHONPATH="$RUNNER_TEMP/py:." "$(which python)" tests/shaping_e2e.py

      - name: AWG server container restart (container_e2e.py)
        # свой образ сервера AWG: правила панели до подъёма сервера, события Docker
        if: always()
        run: sudo env PATH="$RUNNER_TEMP/bin:$PATH" PYTHONPATH="$RUNNER_TEMP/py:." "$(which python)" tests/container_e2e.py

      - name: Moving the AWG server to the host (movehost_e2e.py)
        # последним: ставит awg-quick@awg0 на саму машину (одноразовую)
        if: always()
        run: sudo env PATH="$RUNNER_TEMP/bin:$PATH" PYTHONPATH="$RUNNER_TEMP/py:." "$(which python)" tests/movehost_e2e.py

  kernel:
    # Не держит выпуск: сборка DKMS зависит от PPA Amnezia и ядра машины GitHub. Падение видно в прогоне
    # (и в нём же — почему), а черновик всё равно создаётся: по умолчанию панель на amneziawg-go.
    # Две машины: на 24.04 ядро 7.x (модуль PPA может не собраться — проверяется честный отказ команды),
    # на 22.04 — ядро постарше, на нём проверяется сам туннель на модуле.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.15"

      - name: Tools (pyroute2, awg, amneziawg-go)
        run: |
          python -m pip install -q --target "$RUNNER_TEMP/py" pyroute2==0.9.7
          mkdir -p "$RUNNER_TEMP/bin"
          for stage in awg-go awg-tools; do
            docker build -q --target "$stage" -t "e2e-$stage" . >/dev/null
            id=$(docker create "e2e-$stage")
            docker cp "$id:/out/." "$RUNNER_TEMP/bin/"
            docker rm "$id" >/dev/null
          done
          uname -r

      - name: Kernel module (install.sh --install-kernel)
        id: module
        run: sudo env AWGR_YES=y bash install.sh --install-kernel

      - name: Real tunnel on the kernel module
        run: sudo env AWGT_ENGINE=kernel PATH="$RUNNER_TEMP/bin:$PATH" PYTHONPATH="$RUNNER_TEMP/py:." "$(which python)" tests/awg_real_e2e.py

      - name: Kernel server, amneziawg-go client
        if: always() && steps.module.outcome == 'success'
        run: sudo env AWGT_ENGINE=mixed PATH="$RUNNER_TEMP/bin:$PATH" PYTHONPATH="$RUNNER_TEMP/py:." "$(which python)" tests/awg_real_e2e.py

      - name: DKMS build log
        if: failure()
        run: sudo sh -c 'cat /var/lib/dkms/amneziawg/*/build/make.log 2>/dev/null | tail -80' || true

  # Временное задание выпуска 1.25.0 (убрать до переноса в main): ключи, с которыми панель запускает lego
  # (tlsmgr._lego/_issue), сверяются с `lego run --help` новой версии; и как Docker этой машины делает SNAT
  # сети с com.docker.network.host_ipv4.
  probe-125:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: lego run --help (v5.6.0 and v5.7.0)
        run: |
          old=goacme/lego:v5.6.0@sha256:6f1583fc026a455ea46a7a5858c576105bb69c2e2de69db391cab7f14750350c
          new=goacme/lego:v5.7.0@sha256:9fe6151508c0e1ddc51a6d3e474353520f4b008782bf0c6d31676da72e6d4766
          docker run --rm "$old" run --help > old.txt 2>&1 || true
          docker run --rm "$new" run --help > new.txt 2>&1 || true
          docker run --rm "$new" --version || true
          cat new.txt
          echo "=== diff v5.6.0 -> v5.7.0"
          diff old.txt new.txt || true
          echo "=== flags used by the panel"
          bad=0
          for f in --accept-tos --path --server --key-type --dns --no-random-sleep --http --http.webroot \
                   --http.address --profile --email --renew-force; do
            if grep -qE -- "(^|[ ,])$f([ =,]|$)" new.txt; then echo "ok $f"; else echo "MISSING $f"; bad=1; fi
          done
          grep -qE -- "(^|[ ,])-d([ ,]|$)|--domains" new.txt && echo "ok -d" || { echo "MISSING -d"; bad=1; }
          docker run --rm "$new" dnshelp -c cloudflare 2>&1 | grep -n CF_DNS_API_TOKEN || { echo "MISSING CF_DNS_API_TOKEN"; bad=1; }
          exit $bad

      - name: Docker network with host_ipv4
        run: |
          docker version
          ip -4 addr show
          ip route
          me=$(ip -4 route get 1.1.1.1 | sed -n 's/.* src \([0-9.]*\).*/\1/p')
          docker network create -o com.docker.network.host_ipv4="$me" awgr-probe
          docker network inspect awgr-probe
          sudo iptables -t nat -S POSTROUTING || true
          sudo nft list ruleset | grep -n -i -E "snat|masquerade" || true
          docker run --rm --network awgr-probe alpine:3.22 sh -c "ip -4 addr; ip route; wget -qO- -T 10 https://1.1.1.1/cdn-cgi/trace | grep ip=" || true
          docker network rm awgr-probe
