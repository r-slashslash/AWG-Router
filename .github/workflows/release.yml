# Релизы без ручного ввода тега.
#
# Каждый push в main: тесты, затем, если версия в app/version.py ещё не выпущена, — черновик
# релиза v<VERSION> с архивом кода awg-router.tar.gz, его .sha256 и текстом на 4 языках из
# release-notes/v<VERSION>.md (нет файла — черновика нет, workflow падает).
# Новые коммиты с той же версией обновляют этот черновик (архив, текст, коммит тега).
# Владелец открывает Releases и нажимает Publish: тег создаётся при публикации, вводить его не нужно.
#
# install.sh скачивает именно этот архив (releases/latest/download/awg-router.tar.gz), поэтому у
# файла растёт счётчик скачиваний: установки и обновления панелей.
#
# Готовые образы: из того же коммита собираются образ панели (amd64, arm64) и образ сервера AWG
# (только amd64: базовый amneziavpn/amneziawg-go другим не бывает) и уходят в
# ghcr.io/<владелец>/awg-router с тегами <VERSION> и server-<VERSION>. Их digest записывается в файл
# IMAGES внутри архива: install.sh скачивает образ по digest вместо сборки на сервере (сборка ходит
# в dl-cdn.alpinelinux.org и в GitHub по git, а они фильтруются в России, Китае, Иране — issue #8).
# Архив проверяется по .sha256, digest — сам по себе отпечаток содержимого, так что образ тот же,
# что собрал workflow. Пакет в GHCR должен быть публичным; если анонимно он не скачивается,
# workflow предупреждает, а install.sh собирает образ на месте, как раньше.
#
# Ручной запуск с галочкой check, когда версия уже выпущена, собирает образы и ничего не публикует:
# так проверяется сам workflow (например, после смены версий actions) без нового релиза.
# Релиз, опубликованный вручную, проверяется: тег должен совпадать с VERSION, архив прикладывается,
# если его нет.
name: Release

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      check:
        description: "Only check: build the images, publish nothing (for a version that is already released)"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write           # образы в ghcr.io

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  draft:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Tests
        run: python3 -m unittest discover tests

      - name: Version
        id: v
        run: |
          ver=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' app/version.py)
          [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::app/version.py: bad VERSION '$ver'"; exit 1; }
          tag="v$ver"
          state=$(gh release view "$tag" --json isDraft --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo none)
          latest=$(gh release view --json tagName --jq .tagName 2>/dev/null || echo "")
          if [ "$state" = published ]; then
            echo "$tag is already released, nothing to do"
          elif [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "${latest#v}" "$ver" | sort -V | tail -1)" != "$ver" ]; then
            echo "::error::VERSION $ver is not newer than the latest release $latest"; exit 1
          fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Release notes (4 languages)
        if: steps.v.outputs.state != 'published'
        run: |
          f="release-notes/${{ steps.v.outputs.tag }}.md"
          [ -s "$f" ] || { echo "::error::$f is missing: write the release notes in en / ru / zh / fa"; exit 1; }
          for a in 'id="ru"' 'id="zh"' 'id="fa"'; do
            grep -q "$a" "$f" || { echo "::error::$f has no $a section"; exit 1; }
          done
          cp "$f" notes.md

      - name: Image name
        if: steps.v.outputs.state != 'published' || inputs.check
        id: img
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/awg-router" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
        if: steps.v.outputs.state != 'published' || inputs.check

      - uses: docker/setup-buildx-action@v4
        if: steps.v.outputs.state != 'published' || inputs.check

      - uses: docker/login-action@v4
        if: steps.v.outputs.state != 'published' || inputs.check
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Panel image (amd64, arm64)
        if: steps.v.outputs.state != 'published' || inputs.check
        id: panel
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.v.outputs.state != 'published' }}   # проверка (check) ничего не публикует
          provenance: false     # без манифестов аттестации: индекс читают и старые Docker
          tags: ${{ steps.img.outputs.repo }}:${{ steps.v.outputs.ver }}
          cache-from: type=gha,scope=panel
          cache-to: type=gha,scope=panel,mode=max

      - name: AmneziaWG server image (amd64)
        if: steps.v.outputs.state != 'published' || inputs.check
        id: server
        uses: docker/build-push-action@v7
        with:
          context: awg-server
          platforms: linux/amd64
          push: ${{ steps.v.outputs.state != 'published' }}   # проверка (check) ничего не публикует
          provenance: false
          tags: ${{ steps.img.outputs.repo }}:server-${{ steps.v.outputs.ver }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: Anyone can pull the images
        if: steps.v.outputs.state != 'published'
        env:
          REPO: ${{ steps.img.outputs.repo }}
          DIGEST: ${{ steps.panel.outputs.digest }}
        run: |
          name="${REPO#ghcr.io/}"
          tok=$(curl -sS "https://ghcr.io/token?scope=repository:$name:pull" | jq -r '.token // empty')
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $tok" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/$name/manifests/$DIGEST")
          if [ "$code" = 200 ]; then
            echo "$REPO is public"
          else
            msg="The package $REPO is not public (HTTP $code): panels will build the image themselves. Make it public once: github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/awg-router/settings → Change visibility → Public."
            echo "::warning::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build the archive
        if: steps.v.outputs.state != 'published'
        env:
          PANEL: ${{ steps.img.outputs.repo }}@${{ steps.panel.outputs.digest }}
          SERVER: ${{ steps.img.outputs.repo }}@${{ steps.server.outputs.digest }}
        run: |
          # тот же формат проверяет install.sh (image_ref)
          for r in "$PANEL" "$SERVER"; do
            [[ "$r" =~ ^[a-z0-9][a-z0-9./_-]*@sha256:[0-9a-f]{64}$ ]] || { echo "::error::bad image reference '$r'"; exit 1; }
          done
          printf 'PANEL_IMAGE=%s\nSERVER_IMAGE=%s\n' "$PANEL" "$SERVER" > "$RUNNER_TEMP/IMAGES"
          git archive --format=tar.gz --prefix=awg-router/ --add-file="$RUNNER_TEMP/IMAGES" \
            -o awg-router.tar.gz HEAD
          tar -tzf awg-router.tar.gz awg-router/install.sh awg-router/docker-compose.yml awg-router/IMAGES >/dev/null
          sha256sum awg-router.tar.gz > awg-router.tar.gz.sha256
          ls -l awg-router.tar.gz*
          cat "$RUNNER_TEMP/IMAGES"

      - name: Create or refresh the draft
        if: steps.v.outputs.state != 'published'
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if [ "${{ steps.v.outputs.state }}" = draft ]; then
            gh release edit "$TAG" --target "$GITHUB_SHA" --notes-file notes.md
            gh release upload "$TAG" awg-router.tar.gz awg-router.tar.gz.sha256 --clobber
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "AWG Router $TAG" \
              --notes-file notes.md awg-router.tar.gz awg-router.tar.gz.sha256
          fi
          echo "Draft $TAG is ready: open Releases and press Publish." >> "$GITHUB_STEP_SUMMARY"

  published:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}

      - name: Tag must match VERSION
        run: |
          ver=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' app/version.py)
          [ "v$ver" = "$TAG" ] || { echo "::error::app/version.py says $ver, tag is $TAG"; exit 1; }

      # Архив черновика (с IMAGES) здесь не трогается. Свой архив прикладывается, только если его нет
      # совсем — релиз опубликован мимо черновика; в таком архиве нет IMAGES, и install.sh собирает
      # образ на сервере. (До 1.17.1 проверка «архив есть» не срабатывала никогда — шаблон case требовал
      # два пробела между именами — и архив черновика молча заменялся архивом без IMAGES.)
      - name: Attach the archive if it is missing
        run: |
          have=$(gh release view "$TAG" --json assets --jq "$ASSETS_PRESENT")
          if [ "$have" = true ]; then
            echo "archive is attached"; exit 0
          fi
          git archive --format=tar.gz --prefix=awg-router/ -o awg-router.tar.gz HEAD
          sha256sum awg-router.tar.gz > awg-router.tar.gz.sha256
          gh release upload "$TAG" awg-router.tar.gz awg-router.tar.gz.sha256 --clobber
        env:
          ASSETS_PRESENT: '[.assets[].name] | (index("awg-router.tar.gz") != null and index("awg-router.tar.gz.sha256") != null)'

      - name: The published archive carries the ready images
        run: |
          rm -rf check && mkdir check
          gh release download "$TAG" -p awg-router.tar.gz -D check
          if tar -tzf check/awg-router.tar.gz awg-router/IMAGES >/dev/null 2>&1; then
            tar -xzOf check/awg-router.tar.gz awg-router/IMAGES
          else
            msg="$TAG: the archive has no IMAGES, so panels will build the image on the server instead of downloading it."
            echo "::warning::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi
