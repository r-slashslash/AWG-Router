# Проверка кода на GitHub (net-tests.yml, задание lint): ruff ставится только там, на сервер — нет.
# Найденное — настоящие ошибки (неизвестные имена, неиспользуемое, ошибки синтаксиса, частые ловушки).
[lint]
select = ["F", "B", "E9", "PLE"]
ignore = [
    "B023",   # lambda в цикле: в clean_backup_state и тестах она вызывается сразу, в том же витке цикла
    "B905",   # zip() без strict=: длины совпадают по построению
]
